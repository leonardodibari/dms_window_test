[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR0915", "PLR0912", "PLR2004", "PLC0415", "RUF001", "RUF002", "RUF003", "N806", "N812", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"dmswin_report.py" = ["E501"]  # Markdown/LaTeX prose template

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
mypy_path = "."
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
